<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Info</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.container{
    width:80%;
    max-width:1000px;
    margin-top:40px;
}

.game-header{
    display:flex;
    gap:40px;
    align-items:flex-start;
}

.game-image{
    width:300px;
    height:450px;
    background:#111;
    border-radius:10px;
    overflow:hidden;
    border:3px solid #333;
    box-shadow:0 0 15px rgba(255,255,255,0.08);
}

.game-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.game-info{
    flex:1;
}

.game-title{
    font-size:36px;
    font-weight:bold;
    margin-bottom:20px;
}

.meta{
    margin-bottom:10px;
    color:#ccc;
}

.section{
    margin-top:25px;
}

.section-title{
    font-size:20px;
    margin-bottom:10px;
}

.long{
    line-height:1.6;
    color:#ddd;
}

.video-container{
    margin-top:20px;
    width:100%;
    max-width:520px;
    aspect-ratio:16/9;
}

.video-container iframe{
    width:84%;
    height:84%;
    border-radius:10px;
    border:2px solid #333;
}

.back{
    margin-top:50px;
}

.back a{
    color:#aaa;
    text-decoration:none;
}

.back a:hover{
    color:white;
}

/* Privacy Policy 하단 고정 */
.privacy-policy {
    position: fixed;
    bottom: 10px;
    right: 20px;
    font-size: 12px;
    color: #aaa;
    cursor: pointer;
    z-index: 1000;
}

.privacy-policy:hover {
    color: white;
    text-decoration: underline;
}

</style>

</head>

<body>

<div class="container">

<div class="game-header">

<div class="game-image">
<img id="headImage">
</div>

<div class="game-info">

<div class="game-title" id="name"></div>

<div class="meta"><b>Genre:</b> <span id="genre"></span></div>
<div class="meta"><b>Platform:</b> <span id="platform"></span></div>

<div class="section">
<div class="section-title">Short Description</div>
<div id="short"></div>
</div>

<div class="video-container">
<iframe id="youtubeVideo"
src=""
frameborder="0"
allowfullscreen>
</iframe>
</div>

</div>

</div>

<div class="section">
<div class="section-title">About</div>
<div id="long" class="long"></div>
</div>

<div class="back">
<a href="../index.html">← Back</a>
</div>

</div>

<!-- Privacy Policy 텍스트 -->
<div id="privacyPolicy" class="privacy-policy" style="display:none;">Privacy Policy</div>

<script>

function getGameName()
{
    const params = new URLSearchParams(window.location.search);
    return params.get("game");
}

fetch("gamesiteinfo.json")
.then(response => response.json())
.then(data =>
{
    const game = getGameName();
    const info = data[game];

    if(!info) return; // 게임이 없으면 종료

    document.getElementById("name").textContent = info.name;
    document.getElementById("genre").textContent = info.genre;
    document.getElementById("platform").textContent = info.platform;
    document.getElementById("short").textContent = info.short;
    document.getElementById("long").textContent = info.long;

    document.getElementById("headImage").src = info.head;

    if(info.youtube)
    {
        document.getElementById("youtubeVideo").src = info.youtube;
    }

    // Privacy Policy 처리
    if(info.privacypolicy)
    {
        const pp = document.getElementById("privacyPolicy");
        pp.style.display = "block";
        pp.onclick = () => {
            window.open(info.privacypolicy, "_blank");
        };
    }
});

</script>

</body>
</html>
