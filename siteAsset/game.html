<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Info</title>

<!-- 구글 폰트 가져오기 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Noto+Color+Emoji&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    font-family: 'Raleway', Arial, Helvetica, sans-serif; /* 폰트 적용 */
    background:#000;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.container{
    width:80%;
    max-width:1000px;
    margin-top:40px;
}

.game-header{
    display:flex;
    gap:40px;
    align-items:flex-start;
}

.game-image{
    width:300px;
    height:450px;
    background:#111;
    border-radius:10px;
    overflow:hidden;
    border:3px solid #333;
    box-shadow:0 0 15px rgba(255,255,255,0.08);
}

.game-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.game-info{
    flex:1;
}

.game-title{
    font-size:36px;
    font-weight:bold;
    margin-bottom:20px;
}

.meta{
    margin-bottom:10px;
    color:#ccc;
}

.section{
    margin-top:25px;
}

.section-title{
    font-size:20px;
    margin-bottom:10px;
}

.long {
    line-height: 1.6;
    color: #ddd;
    white-space: pre-wrap; /* JSON에서 \n 그대로 줄바꿈 */
}

.video-container{
    margin-top:20px;
    width:100%;
    max-width:520px;
    aspect-ratio:16/9;
}

.video-container iframe{
    width:84%;
    height:84%;
    border-radius:10px;
    border:2px solid #333;
}

.back{
    margin-top:50px;
}

.back a{
    color:#aaa;
    text-decoration:none;
}

.back a:hover{
    color:white;
}

/* Privacy Policy 하단 고정 */
.privacy-policy {
    position: fixed;
    bottom: 10px;
    right: 20px;
    font-size: 12px;
    color: #aaa;
    cursor: pointer;
    z-index: 1000;
}

.privacy-policy:hover {
    color: white;
    text-decoration: underline;
}

/* 플랫폼 아이콘 */
.platform-icon {
    width: 20px;
    height: 20px;
    margin-right: 8px;
    vertical-align: middle;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="game-header">

<div class="game-image">
<img id="headImage">
</div>

<div class="game-info">

<div class="game-title" id="name"></div>

<div class="meta"><b>Genre:</b> <span id="genre"></span></div>
<div class="meta"><b>GameStart:</b> <span id="platform"></span></div>

<div class="section">
<div class="section-title">Short Description</div>
<div id="short"></div>
</div>

<div class="video-container">
<iframe id="youtubeVideo"
src=""
frameborder="0"
allowfullscreen>
</iframe>
</div>

</div>

</div>

<div class="section">
<div class="section-title">About</div>
<div id="long" class="long"></div>
</div>

<div class="back">
<a href="../index.html">← Back</a>
</div>

</div>

<!-- Privacy Policy 텍스트 -->
<div id="privacyPolicy" class="privacy-policy" style="display:none;">Privacy Policy</div>

<script>
function getGameName() {
    const params = new URLSearchParams(window.location.search);
    return params.get("game");
}

// 상대 경로 기준 플랫폼 이미지
const platformLogos = {
    "iOS": "platformLogo/AppStore.png",
    "Android": "platformLogo/PlayStore.png",
    "Steam": "platformLogo/Steam.png"
};

// 플랫폼 아이콘 생성
function createPlatformIcons(info) {
    const container = document.getElementById("platform");
    container.innerHTML = ""; // 초기화

    if(info.appstore){
        const img = document.createElement("img");
        img.src = platformLogos["iOS"];
        img.className = "platform-icon";
        img.title = "App Store";
        img.onclick = () => window.open(info.appstore, "_blank");
        container.appendChild(img);
    }

    if(info.playstore){
        const img = document.createElement("img");
        img.src = platformLogos["Android"];
        img.className = "platform-icon";
        img.title = "Google Play";
        img.onclick = () => window.open(info.playstore, "_blank");
        container.appendChild(img);
    }

    if(info.steam){
        const img = document.createElement("img");
        img.src = platformLogos["Steam"];
        img.className = "platform-icon";
        img.title = "Steam";
        img.onclick = () => window.open(info.steam, "_blank");
        container.appendChild(img);
    }
}

// JSON 데이터 로딩
fetch("gamesiteinfo.json")
.then(response => response.json())
.then(data => {
    const game = getGameName();
    const info = data[game];

    if(!info) return;

    document.getElementById("name").textContent = info.name;
    document.getElementById("genre").textContent = info.genre;
    document.getElementById("short").textContent = info.short;
    document.getElementById("long").textContent = info.long;
    document.getElementById("headImage").src = info.head;

    if(info.youtube){
        document.getElementById("youtubeVideo").src = info.youtube;
    }

    // Privacy Policy 처리
    if(info.privacypolicy){
        const pp = document.getElementById("privacyPolicy");
        pp.style.display = "block";
        pp.onclick = () => window.open(info.privacypolicy, "_blank");
    }

    // 플랫폼 아이콘 처리
    createPlatformIcons(info);
});
</script>

</body>
</html>
